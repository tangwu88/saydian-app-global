name: saydian_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1008

environment:
  sdk: ^3.12.2

dependencies:
  camera: ^0.11.2+1
  connectivity_plus: ^7.3.1
  crypto: ^3.0.6
  device_info_plus: ^13.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^10.3.1
  fl_chart: ^1.1.1
  geolocator: ^14.0.3
  http: ^1.6.0
  image_picker: ^1.2.3
  intl: ^0.20.2
  phone_numbers_parser: ^9.0.26
  country_picker: ^2.0.28
  html: ^0.15.6
  http_parser: ^4.1.2
  jpush_flutter: 3.5.1
  jpush_flutter_android: 1.0.2
  path: ^1.9.1
  path_provider: ^2.1.6
  package_info_plus: ^10.2.1
  permission_handler: ^12.0.3
  share_plus: ^13.3.0
  sqflite_sqlcipher: ^3.4.0
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  yc_product_plugin:
    git:
      url: https://gitee.com/yucheng_3/yc_product_plugin.git
      path: code
      ref: 5ca3050d7170509d386f548fcae7d5f8b457febf

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.2

# Keep the required 1.0.2 plugin reproducible across developer machines and CI.
# The vendored copy only removes application-wide R8 options that AGP rejects
# when they are declared from an Android library's consumer ProGuard file.
dependency_overrides:
  # Keep the required 3.5.1 plugin reproducible and suppress its Android
  # setup-argument log, which otherwise exposes the configured AppKey.
  jpush_flutter:
    path: third_party/jpush_flutter
  jpush_flutter_android:
    path: third_party/jpush_flutter_android

flutter:
  generate: true
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/china_regions.json
    - assets/branding/saidian-brand-lockup.png
    - assets/branding/saidian-brand-mark.png
    - assets/branding/ai-health-manager-doctor.png
